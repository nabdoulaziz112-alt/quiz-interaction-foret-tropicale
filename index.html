<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f6b45">
<title>Quiz — Interaction en forêt tropicale</title>
<style>
:root{
  --green:#1f6b45;
  --green2:#2f8a5c;
  --light:#eef7f1;
  --dark:#17352a;
  --text:#24332c;
  --muted:#65756d;
  --border:#d8e5dd;
  --danger:#b83b3b;
  --success:#217346;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#eaf5ee,#f7faf8);
  min-height:100vh;
}
.container{
  width:min(760px,94%);
  margin:0 auto;
  padding:24px 0 40px;
}
.header{
  background:var(--green);
  color:white;
  border-radius:22px;
  padding:28px 24px;
  text-align:center;
  box-shadow:0 10px 30px rgba(31,107,69,.18);
}
.header .icon{font-size:44px}
.header h1{margin:8px 0 8px;font-size:clamp(25px,6vw,38px)}
.header p{margin:0;opacity:.92;font-size:16px;line-height:1.5}
.card{
  background:white;
  margin-top:18px;
  padding:24px;
  border-radius:20px;
  box-shadow:0 7px 25px rgba(23,53,42,.08);
  border:1px solid var(--border);
}
.progress-row{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:14px;
  margin-bottom:9px;
  font-weight:600;
}
.progress{
  height:10px;
  background:#e5eee8;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:24px;
}
.progress-bar{
  height:100%;
  background:var(--green2);
  width:10%;
  transition:width .3s ease;
}
.question{
  font-size:22px;
  line-height:1.35;
  color:var(--dark);
  margin:0 0 18px;
}
.instruction{
  color:var(--muted);
  font-size:14px;
  margin:-8px 0 17px;
}
.options{display:grid;gap:11px}
.option{
  display:flex;
  align-items:flex-start;
  gap:12px;
  border:2px solid var(--border);
  border-radius:14px;
  padding:14px;
  cursor:pointer;
  transition:.15s;
  background:#fff;
}
.option:hover{border-color:#8bbda2;background:#f8fcf9}
.option input{margin-top:3px;accent-color:var(--green);transform:scale(1.15)}
.option.selected{border-color:var(--green2);background:var(--light)}
.option.correct{border-color:var(--success);background:#eaf7ee}
.option.incorrect{border-color:var(--danger);background:#fff0f0}
.option.disabled{cursor:default}
.feedback{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  line-height:1.55;
}
.feedback.show{display:block}
.feedback.correct{background:#eaf7ee;border:1px solid #b9ddc5}
.feedback.incorrect{background:#fff0f0;border:1px solid #e8bcbc}
.feedback strong{display:block;margin-bottom:5px}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button{
  border:0;
  border-radius:13px;
  padding:13px 20px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}
#validateBtn{background:var(--green);color:#fff;flex:1}
#nextBtn{background:#e9f1ec;color:var(--green);flex:1;display:none}
#restartBtn{background:var(--green);color:white;width:100%;margin-top:15px}
button:disabled{opacity:.45;cursor:not-allowed}
.score{
  text-align:center;
  padding:15px 0 5px;
}
.score-circle{
  width:145px;height:145px;border-radius:50%;
  background:var(--light);
  border:9px solid #b9ddc5;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  margin:0 auto 20px;
}
.score-number{font-size:38px;font-weight:800;color:var(--green)}
.score-label{color:var(--muted);font-size:13px}
.result-message{font-size:19px;line-height:1.5}
.hidden{display:none!important}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
.badge{
  display:inline-block;padding:5px 9px;border-radius:20px;
  background:#e9f1ec;color:var(--green);font-size:12px;font-weight:700;
  margin-bottom:10px;
}
@media(max-width:520px){
  .container{padding-top:12px}
  .card{padding:18px}
  .header{padding:22px 17px}
  .question{font-size:19px}
  .option{padding:12px}
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="icon">🌳</div>
    <h1>Quiz — Interaction en forêt tropicale</h1>
    <p>Testez vos connaissances sur les relations entre les organismes et le fonctionnement des forêts tropicales.</p>
  </header>

  <main id="quizCard" class="card">
    <div class="progress-row">
      <span id="progressText">Question 1 / 10</span>
      <span id="scoreText">Score : 0</span>
    </div>
    <div class="progress"><div id="progressBar" class="progress-bar"></div></div>

    <div class="badge" id="typeBadge">Question</div>
    <h2 class="question" id="question"></h2>
    <p class="instruction" id="instruction"></p>
    <div class="options" id="options"></div>

    <div id="feedback" class="feedback"></div>

    <div class="actions">
      <button id="validateBtn" onclick="validateAnswer()">Valider</button>
      <button id="nextBtn" onclick="nextQuestion()">Question suivante →</button>
    </div>
  </main>

  <section id="resultCard" class="card hidden">
    <div class="score">
      <div class="score-circle">
        <div class="score-number" id="finalScore">0/10</div>
        <div class="score-label">bonnes réponses</div>
      </div>
      <h2 id="resultTitle">Bravo !</h2>
      <p class="result-message" id="resultMessage"></p>
      <button id="restartBtn" onclick="restartQuiz()">↻ Recommencer le quiz</button>
    </div>
  </section>

  <div class="footer">Quiz scientifique — Interaction en forêt tropicale</div>
</div>

<script>
    const questions = [
  {
    q: "Dans une forêt tropicale dense, quelle ressource peut fortement limiter la croissance des jeunes plantes en sous-bois ?",
    taper: "célibataire",
    instruction: "Choisissez une seule réponse.",
    options: ["La lumière", "L'eau", "Les nutriments"],
    répondre: [0],
    explication: "En sous-bois, la lumière est très limitée, ce qui freine la croissance des jeunes plantes."
  },

  {
    q: "Quels sont les bénéfices apportés par les bactéries du genre Rhizobium à la plante ?",
    taper: "célibataire",
    instruction: "Choisissez une seule réponse.",
    options: [
      "Production de substances favorisant la croissance",
      "Protection contre les pathogènes",
      "Augmentation de la biodisponibilité de nutriments du sol (ex : azote)",
      "Absorption d'eau et de nutriments"
    ],
    répondre: [2],
    explication: "Les Rhizobium fixent l’azote atmosphérique, le rendant disponible pour la plante."
  },

  {
    q: "Qu'est-ce que la myrmécochorie ?",
    taper: "célibataire",
    instruction: "Choisissez une seule réponse.",
    options: [
      "La pollinisation des fleurs par les fourmis",
      "La dispersion des graines par les fourmis",
      "La dispersion des graines par le vent"
    ],
    répondre: [1],
    explication: "La myrmécochorie est la dispersion des graines par les fourmis."
  },

  {
    q: "Laquelle de ces interactions est négative (les deux espèces sont défavorisées) ?",
    taper: "célibataire",
    instruction: "Choisissez une seule réponse.",
    options: ["Prédation", "Parasitisme", "Mutualisme", "Compétition"],
    répondre: [3],
    explication: "La compétition défavorise les deux espèces car elles se disputent une ressource."
  },

  {
    q: "Lesquelles de ces interactions sont positives pour une espèce et négatives pour l'autre ?",
    taper: "multiple",
    instruction: "Choisissez une ou plusieurs réponses.",
    options: ["Mutualisme", "Prédation", "Compétition", "Parasitisme"],
    répondre: [1, 3],
    explication: "La prédation et le parasitisme bénéficient à une espèce au détriment de l'autre."
  },

  {
    q: "Laquelle de ces interactions est neutre (bénéfice pour une espèce tandis que l'autre n'est pas affectée) ?",
    taper: "célibataire",
    instruction: "Choisissez une seule réponse.",
    options: ["Commensalisme", "Prédation", "Mutualisme", "Compétition"],
    répondre: [0],
    explication: "Le commensalisme profite à une espèce sans affecter l'autre."
  },

  {
    q: "Quel rôle peuvent jouer les COV émis par les plantes ?",
    taper: "célibataire",
    instruction: "Choisissez une seule réponse.",
    options: [
      "Ils servent uniquement à la respiration de la plante",
      "Ils peuvent attirer des pollinisateurs ou alerter les plantes voisines en cas d'attaque",
      "Ils empêchent toute interaction avec les animaux",
      "Ils remplacent les racines pour absorber l'eau"
    ],
    répondre: [1],
    explication: "Les COV servent à communiquer ou attirer des pollinisateurs."
  },

  {
    q: "Quel est le rôle principal de la canopée dans une forêt tropicale ?",
    taper: "célibataire",
    instruction: "Choisissez une seule réponse.",
    options: [
      "Produire de l’oxygène",
      "Réguler la lumière atteignant le sous-bois",
      "Favoriser la prédation",
      "Augmenter la compétition entre les plantes"
    ],
    répondre: [1],
    explication: "La canopée filtre la lumière et influence fortement les conditions du sous-bois."
  },

  {
    q: "Quel type d’interaction décrit une relation où une espèce bénéficie tandis que l’autre est désavantagée, sans être tuée ?",
    taper: "célibataire",
    instruction: "Choisissez une seule réponse.",
    options: ["Mutualisme", "Parasitisme", "Prédation", "Commensalisme"],
    répondre: [1],
    explication: "Le parasitisme désavantage l’hôte sans le tuer immédiatement."
  },

  {
    q: "Quel est l’effet principal de la compétition entre plantes dans les forêts tropicales ?",
    taper: "célibataire",
    instruction: "Choisissez une seule réponse.",
    options: [
      "Augmentation de la biodiversité",
      "Réduction de l’accès aux ressources",
      "Amélioration de la pollinisation",
      "Augmentation de la dispersion des graines"
    ],
    répondre: [1],
    explication: "La compétition réduit l’accès à la lumière, l’eau ou les nutriments."
  }
];
let current = 0;
let score = 0;
let answered = false;

const qEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const validateBtn = document.getElementById("validateBtn");
const nextBtn = document.getElementById("nextBtn");

function renderQuestion(){
  answered = false;
  const item = questions[current];

  document.getElementById("progressText").textContent =
    `Question ${current+1} / ${questions.length}`;
  document.getElementById("scoreText").textContent = `Score : ${score}`;
  document.getElementById("progressBar").style.width =
    `${((current+1)/questions.length)*100}%`;

  qEl.textContent = item.q;
  document.getElementById("instruction").textContent = item.instruction;

  const badge = document.getElementById("typeBadge");
  badge.textContent =
    item.type === "multi" ? "Réponses multiples" :
    item.type === "boolean" ? "Vrai / Faux" : "Question";

  optionsEl.innerHTML = "";
  item.options.forEach((text,index)=>{
    const label = document.createElement("label");
    label.className = "option";
    label.innerHTML = `
      <input type="${item.type === "multi" ? "checkbox" : "radio"}"
             name="answer" value="${index}">
      <span>${text}</span>
    `;
    label.addEventListener("click",()=>{
      if(answered) return;
      if(item.type !== "multi"){
        document.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));
      }
      setTimeout(()=>{
        const input = label.querySelector("input");
        if(input.checked) label.classList.add("selected");
        else label.classList.remove("selected");
      },0);
    });
    optionsEl.appendChild(label);
  });

  feedbackEl.className = "feedback";
  feedbackEl.innerHTML = "";
  validateBtn.style.display = "block";
  validateBtn.disabled = false;
  nextBtn.style.display = "none";
}

function getSelected(){
  return [...document.querySelectorAll('input[name="answer"]:checked')]
    .map(el=>Number(el.value)).sort((a,b)=>a-b);
}

function arraysEqual(a,b){
  return a.length === b.length && a.every((v,i)=>v===b[i]);
}

function validateAnswer(){
  if(answered) return;

  const selected = getSelected();
  if(selected.length === 0){
    alert("Veuillez sélectionner une réponse.");
    return;
  }

  answered = true;
  const item = questions[current];
  const correct = arraysEqual(selected,item.answer);

  if(correct) score++;

  document.querySelectorAll(".option").forEach((label,index)=>{
    const input = label.querySelector("input");
    input.disabled = true;
    label.classList.add("disabled");
    if(item.answer.includes(index)) label.classList.add("correct");
    if(selected.includes(index) && !item.answer.includes(index))
      label.classList.add("incorrect");
  });

  feedbackEl.className = "feedback show " + (correct ? "correct" : "incorrect");
  feedbackEl.innerHTML =
    `<strong>${correct ? "✓ Bonne réponse !" : "✗ Réponse incorrecte"}</strong>
     ${item.explanation}`;

  document.getElementById("scoreText").textContent = `Score : ${score}`;
  validateBtn.style.display = "none";
  nextBtn.style.display = "block";
  nextBtn.textContent =
    current === questions.length-1 ? "Voir mon résultat →" : "Question suivante →";
}

function nextQuestion(){
  if(!answered) return;
  current++;
  if(current < questions.length){
    renderQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  document.getElementById("quizCard").classList.add("hidden");
  document.getElementById("resultCard").classList.remove("hidden");

  document.getElementById("finalScore").textContent = `${score}/${questions.length}`;

  let title, message;
  const ratio = score/questions.length;

  if(ratio === 1){
    title = "Excellent ! 🌿";
    message = "Vous maîtrisez très bien les principales interactions écologiques en forêt tropicale.";
  }else if(ratio >= .7){
    title = "Très bon résultat ! 🌳";
    message = "Vous avez une bonne compréhension des interactions et de leur rôle dans l’écosystème forestier.";
  }else if(ratio >= .5){
    title = "Bon début ! 🌱";
    message = "Vous avez les bases. Relisez les explications des questions pour consolider vos connaissances.";
  }else{
    title = "Continuez à apprendre ! 🍃";
    message = "Les interactions écologiques sont nombreuses et complexes. Les explications du quiz peuvent vous aider à progresser.";
  }

  document.getElementById("resultTitle").textContent = title;
  document.getElementById("resultMessage").textContent = message;
}

function restartQuiz(){
  current = 0;
  score = 0;
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("quizCard").classList.remove("hidden");
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
